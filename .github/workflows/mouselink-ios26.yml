name: MouseLink iOS 26 compatibility
on:
  pull_request:
    paths: ['MouseLink/**', '.github/workflows/mouselink-ios26.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios26:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected SDK and generate project
        run: |
          set -euo pipefail
          mkdir -p MouseLink/out/ios26
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee MouseLink/out/ios26/toolchain.txt
          xcrun --sdk iphonesimulator --show-sdk-version | tee MouseLink/out/ios26/sdk.txt
          grep -q '^26\.' MouseLink/out/ios26/sdk.txt
          python3 MouseLink/tools/package_panel_app.py
          command -v xcodegen || brew install xcodegen
          (cd MouseLink/out && xcodegen generate)
          xcrun simctl list devices available -j > MouseLink/out/ios26/devices.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('MouseLink/out/ios26/devices.json').read_text())
          choices = [(runtime, d) for runtime, devices in data['devices'].items()
                     for d in devices if 'iOS-26-2' in runtime and 'iPad Pro' in d['name'] and d.get('isAvailable')]
          if not choices:
              raise SystemExit('Required installed iOS 26.2 iPad simulator unavailable; no fallback to iOS 18')
          runtime, device = choices[0]
          Path('MouseLink/out/ios26/device-id.txt').write_text(device['udid'])
          Path('MouseLink/out/ios26/runtime.json').write_text(json.dumps({'runtime': runtime, 'device': device}, indent=2))
          print(runtime, device['name'], device['udid'])
          PY
          git rev-parse HEAD > MouseLink/out/ios26/checkout-sha.txt
      - name: Build device Release with iOS 26 SDK
        run: |
          set -euo pipefail
          xcodebuild -project MouseLink/out/MouseLink.xcodeproj -scheme MouseLink -sdk iphoneos -destination 'generic/platform=iOS' -configuration Release -derivedDataPath MouseLink/Device26DerivedData CODE_SIGNING_ALLOWED=NO build > MouseLink/out/ios26/device-build.log 2>&1 || { tail -80 MouseLink/out/ios26/device-build.log; exit 1; }
          tail -6 MouseLink/out/ios26/device-build.log
      - name: Native safety tests on iOS 26.2
        run: |
          set -euo pipefail
          DEVICE=$(cat MouseLink/out/ios26/device-id.txt)
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project MouseLink/out/MouseLink.xcodeproj -scheme MouseLink -destination "platform=iOS Simulator,id=$DEVICE" -only-testing:MouseLinkNativeTests -parallel-testing-enabled NO -derivedDataPath MouseLink/Derived26Data -resultBundlePath MouseLink/out/ios26/Native.xcresult CODE_SIGNING_ALLOWED=NO test > MouseLink/out/ios26/native.log 2>&1 || { tail -100 MouseLink/out/ios26/native.log; exit 1; }
          tail -15 MouseLink/out/ios26/native.log
      - name: App UI and screenshots on iOS 26.2
        run: |
          set -euo pipefail
          DEVICE=$(cat MouseLink/out/ios26/device-id.txt)
          set +e
          xcodebuild -project MouseLink/out/MouseLink.xcodeproj -scheme MouseLink -destination "platform=iOS Simulator,id=$DEVICE" -only-testing:MouseLinkUITests -skip-testing:MouseLinkUITests/SplitWindowUITests -skip-testing:MouseLinkUITests/PhoneLayoutUITests -parallel-testing-enabled NO -derivedDataPath MouseLink/Derived26Data -resultBundlePath MouseLink/out/ios26/UI.xcresult CODE_SIGNING_ALLOWED=NO test > MouseLink/out/ios26/ui.log 2>&1
          STATUS=$?
          set -e
          tail -80 MouseLink/out/ios26/ui.log
          xcrun xcresulttool export attachments --path MouseLink/out/ios26/UI.xcresult --output-path MouseLink/out/ios26/screenshots || true
          exit "$STATUS"
      - name: Reject view-update and panel isolation warnings
        run: |
          set -euo pipefail
          for log in native ui device-build; do
            test -s "MouseLink/out/ios26/$log.log"
            if grep -nE 'Publishing changes from within view updates|Modifying state during view update|conformance of .PanelSession. to protocol .ObservableObject. crosses into main actor-isolated' "MouseLink/out/ios26/$log.log"; then exit 1; fi
          done
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MouseLink-iOS26-validation
          retention-days: 14
          path: MouseLink/out/ios26
